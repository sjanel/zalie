name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -D ZALIE_BUILD_TESTS=ON `
            -D ZALIE_WARNINGS_AS_ERRORS=ON `
            -D OPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build
        run: cmake --build build --config ${{ matrix.build }} --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config ${{ matrix.build }} --output-on-failure --timeout 180 -j 4
